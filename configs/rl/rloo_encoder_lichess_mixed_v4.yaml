# Proposed conservative v4 pilot. Not a validated improvement.
# Starts from the supervised checkpoint; never resumes v1/v2/v3 implicitly.
database:
  manifest: processed_games/rl/lichess_mixed_v1/train.json
checkpoint_path: checkpoints/chess_encoder_seq_balanced_v1.best.pt
model_type: encoder
model_kwargs:
  version: 2
  img_size: 256
  encoder_dim: 256
  n_heads: 4
  n_layers: 8
  ep_embed_dim: 16
  piece_embed_dim: 32
server:
  mode: local
  opponent:
    executable: stockfish
    workers: 3
    threads_per_engine: 1
    hash_mb_per_engine: 64
    limit_strength: false
    uci_elo: null
    default_limit:
      movetime_ms: 50
  evaluator:
    executable: stockfish
    workers: 1
    threads_per_engine: 1
    hash_mb_per_engine: 128
    default_limit:
      nodes: 100000
rloo:
  training_batch_size: 32 # independent starting positions, up from 8
  rollouts_per_entry: 4 # 128 trajectories per optimizer update
  max_concurrent_games: 8 # effective batch grows without more simultaneous games
  sampling_batch_size: 2
  micro_batch_size: 1
  ply_depth: 10 # keep credit assignment comparable to v2
  randomize_policy_color: false
  temperature: 0.8
  learning_rate: 2.0e-06
  kl_beta: 0.10
  reward_mode: tanh
  reward_scale_cp: 400.0
  max_grad_norm: 1.0
  device: auto
  seed: 42
# Two epochs are a possible later target, conditional on validation.
# This file deliberately stops after 100 updates (3,200 starting positions).
# Archive the pilot weights before continuing. To continue, add resume_path
# pointing at this latest checkpoint and raise/remove max_updates.
epochs: 2
max_updates: 100
save_every_batches: 10
output_checkpoint: checkpoints/rloo_encoder_balanced_v1_lichess_mixed_v4.latest.pt
export_weights: checkpoints/rloo_encoder_balanced_v1_lichess_mixed_v4.pt
logging:
  stdout: true
  jsonl_path: logs/rloo_encoder_lichess_mixed_v4.metrics.jsonl
  wandb:
    enabled: true
    project: chess_vision
    name: rloo_encoder_lichess_mixed_v4
    mode: online
    offline_fallback: true
    init_timeout_s: 30
