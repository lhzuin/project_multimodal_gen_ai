database:
  manifest: train/grpo/examples/prompts.json
checkpoint_path: checkpoints/chess_llm_decoder_balanced_v1.best.pt
model_type: decoder
model_kwargs:
  tokenizer_path: tokenizers/chess_uci_vocab.json
  model_dim: 256
  n_heads: 4
  n_layers: 12
  dropout: 0.1
  max_seq_len: 256
  tie_weights: true
server:
  mode: remote
  host: 127.0.0.1
  port: 8765
grpo:
  training_batch_size: 2
  rollouts_per_entry: 4
  max_concurrent_games: 4
  sampling_batch_size: 2
  micro_batch_size: 1
  ply_depth: 10
  randomize_policy_color: true
  temperature: 0.8
  learning_rate: 1.0e-05
  kl_beta: 0.04
  device: auto
epochs: 1
output_checkpoint: checkpoints/grpo_decoder_demo.latest.pt
export_weights: checkpoints/grpo_decoder_demo.pt
