experiment_name: "chess_encoder_seq_v2"
wandb_project: "chess_vision"
log: true
seed: 42
acc_epsilon: 1e-3
img_resolution: 256

checkpoint_save_path: ${experiment_name}.pt
checkpoint_load_path: null #${hydra:runtime.cwd}/checkpoints/chess_encoder_seq_v1.pt
use_warmup: true
use_legal_mask: true
train_input: pieces   # or "image"

trainer:
  grad_accum_steps: 4        # 256*4 = global batch 1024 (recommended)  [oai_citation:9‡Literature‑backed hyperparameters for a small–medium Transformer chess policy network.pdf](sediment://file_00000000921472468c25bbb345c81e8d)
  grad_clip_norm: 1.0

data:
  val_fraction: 0.05
  samples_path: ${hydra:runtime.cwd}/processed_games/games_samples_large_s${seed}_r0.15_m32.json


train_stages:
  - name: stage1
    epochs: 20
    warmup_fraction: 0.05
    lr_scheduler: cosine
    groups:
      encoder: lr_enc
      classifier: lr_class

early_stopping:
  patience: 1
  min_epochs: 2

collate:
  _target_: dataset.collate.CollateGameSequences

dataloader:
  batch_size: 2
  shuffle: true
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  drop_last: false

dataset_train:
  _target_: dataset.dataset.ChessGameSequenceDataset
  pgn_path: ${hydra:runtime.cwd}/processed_games/games_large.pgn
  index_path: ${hydra:runtime.cwd}/processed_games/games_large_index.json
  sprites_dir: ${hydra:runtime.cwd}/dataset/sprites
  seed: ${seed}
  max_seq_len: 64
  random_window: true
  return_fen: false
  return_images: false
  return_piece_probs: false
  cache_size: 64

dataset_val:
  _target_: dataset.dataset.ChessGameSequenceDataset
  pgn_path: ${hydra:runtime.cwd}/processed_games/games_large.pgn
  index_path: ${hydra:runtime.cwd}/processed_games/games_large_index.json
  sprites_dir: ${hydra:runtime.cwd}/dataset/sprites
  seed: ${seed}
  max_seq_len: 64
  random_window: true
  return_fen: false
  return_images: false
  return_piece_probs: false
  cache_size: 64

model:
  instance:
    _target_: models.chess_encoder_player.ChessEncoderPlayerV2
    piece_embed_dim: 32
    img_size: ${img_resolution}
    vit_path: ${hydra:runtime.cwd}/checkpoints/chess_classifier_vit_v2.pt
    freeze_vit: true
    ep_embed_dim: 16
    encoder_dim: 256
    n_heads: 4
    n_layers: 8
    encoder_dropout: 0.1

optim:
  _target_: torch.optim.AdamW
  betas: [0.9, 0.98]         # recommended default  [oai_citation:12‡Literature‑backed hyperparameters for a small–medium Transformer chess policy network.pdf](sediment://file_00000000921472468c25bbb345c81e8d)
  eps: 1.0e-8                # recommended default  [oai_citation:13‡Literature‑backed hyperparameters for a small–medium Transformer chess policy network.pdf](sediment://file_00000000921472468c25bbb345c81e8d)
  lr_enc: 4e-4               # at global batch 1024  [oai_citation:14‡Literature‑backed hyperparameters for a small–medium Transformer chess policy network.pdf](sediment://file_00000000921472468c25bbb345c81e8d)
  lr_class: 6e-4             # head ≈ 1.5× encoder  [oai_citation:15‡Literature‑backed hyperparameters for a small–medium Transformer chess policy network.pdf](sediment://file_00000000921472468c25bbb345c81e8d)
  weight_decay: 0.01

loss_fn:
  _target_: torch.nn.CrossEntropyLoss