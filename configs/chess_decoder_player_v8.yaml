experiment_name: "chess_llm_decoder_v8"
wandb_project: "chess_vision"
log: true
seed: 42
acc_epsilon: 1e-3

checkpoint_save_path: ${experiment_name}.pt
use_warmup: true
piece_loss_weight: 0.3

trainer:
  grad_accum_steps: 1
  grad_clip_norm: 1.0

data:
  val_fraction: 0.05

dataloader:
  batch_size: 32
  shuffle: true
  num_workers: 4
  pin_memory: false
  persistent_workers: true
  drop_last: false

train_stages:
  - name: stage1
    epochs: 10
    warmup_fraction: 0.05
    lr_scheduler: cosine
    groups:
      decoder: lr_dec
      lm_head: lr_head
      piece_head: lr_piece

early_stopping:
  patience: 3
  min_epochs: 2

collate:
  _target_: dataset.collate_llm.CollateLLMMoves
  pad_id: 0
  piece_pad_id: 0
  max_len: 256

dataset_train:
  _target_: dataset.pgn_move_dataset.PGNMoveDataset
  pgn_path: ${hydra:runtime.cwd}/processed_games/games_xl.pgn
  index_path: ${hydra:runtime.cwd}/processed_games/games_xl_index.json
  tokenizer_path: ${hydra:runtime.cwd}/tokenizers/chess_uci_vocab.json
  block_size: 256
  strict: true
  seed: ${seed}

dataset_val:
  _target_: dataset.pgn_move_dataset.PGNMoveDataset
  pgn_path: ${hydra:runtime.cwd}/processed_games/games_xl.pgn
  index_path: ${hydra:runtime.cwd}/processed_games/games_xl_index.json
  tokenizer_path: ${hydra:runtime.cwd}/tokenizers/chess_uci_vocab.json
  block_size: 256
  strict: true
  seed: ${seed}

model:
  instance:
    _target_: models.chess_decoder_player.ChessDecoderPlayer
    tokenizer_path: ${hydra:runtime.cwd}/tokenizers/chess_uci_vocab.json
    model_dim: 256
    mlp_ratio: 4.0
    n_heads: 4
    n_layers: 6
    dropout: 0.1
    max_seq_len: 256
    tie_weights: true

optim:
  _target_: torch.optim.AdamW
  betas: [0.9, 0.98]
  eps: 1.0e-8
  lr_dec: 2e-4
  lr_head: 6e-4
  lr_piece: 6e-4
  weight_decay: 0.01

loss_fn:
  _target_: torch.nn.CrossEntropyLoss